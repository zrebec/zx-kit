<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zx-kit Save Slots</title>
  <style>
    :root {
      color-scheme: dark;
      background: #050505;
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(#111 1px, transparent 1px),
        linear-gradient(90deg, #111 1px, transparent 1px),
        #050505;
      background-size: 24px 24px;
    }

    main {
      display: grid;
      gap: 16px;
      justify-items: center;
      padding: 24px;
    }

    canvas {
      image-rendering: pixelated;
      border: 8px solid #1c1c1c;
      box-shadow: 0 0 0 2px #444, 0 18px 60px rgba(0, 0, 0, 0.65);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 820px;
    }

    button {
      appearance: none;
      border: 2px solid #ffffff;
      background: #000000;
      color: #ffffff;
      font: inherit;
      padding: 9px 14px;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: #0033ff;
      outline: none;
    }
  </style>
</head>

<body>
  <main>
    <canvas id="screen" aria-label="ZX Spectrum style save slot demo"></canvas>
    <div class="controls">
      <button id="auto" type="button">Auto Save</button>
      <button id="manual" type="button">Manual Save</button>
      <button id="latest" type="button">Load Latest</button>
      <button id="load-auto" type="button">Load Auto</button>
      <button id="delete-manual" type="button">Delete Manual</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </main>

  <script type="module">
    import {
      C,
      setupCanvas,
      drawText,
      drawTextCentered,
      drawFrame,
      drawBox,
      createBitmapFromRows,
      drawBitmap,
      createSaveProfile,
      writeSave,
      writeSaveThrottled,
      readSave,
      readSaveLatest,
      deleteSave,
      listSaves,
    } from '../../dist/index.js'

    const canvas = document.getElementById('screen')
    const ctx = setupCanvas(canvas, 3)
    const autoButton = document.getElementById('auto')
    const manualButton = document.getElementById('manual')
    const latestButton = document.getElementById('latest')
    const loadAutoButton = document.getElementById('load-auto')
    const deleteManualButton = document.getElementById('delete-manual')
    const resetButton = document.getElementById('reset')

    const SHIP = createBitmapFromRows([
      '...##...',
      '..####..',
      '.######.',
      '########',
      '##.##.##',
      '...##...',
      '..#..#..',
      '.##..##.',
    ])

    const LANGS = ['EN', 'SK', 'DE']
    const AUTO_INTERVAL_MS = 3500

    const state = {
      score: 1200,
      lives: 3,
      sector: 1,
      language: 'EN',
      pilot: { x: 120, y: 152 },
    }

    let message = 'ARROWS MOVE  SPACE SCORES'
    let messageColor = C.B_WHITE
    let flashUntil = 0

    const save = createSaveProfile({
      key: 'save-slots-demo',
      version: 1,
      serialize: () => ({
        score: state.score,
        lives: state.lives,
        sector: state.sector,
        language: state.language,
        pilot: { x: state.pilot.x, y: state.pilot.y },
      }),
      deserialize: (data) => {
        state.score = data.score
        state.lives = data.lives
        state.sector = data.sector
        state.language = data.language
        state.pilot.x = data.pilot.x
        state.pilot.y = data.pilot.y
      },
    })

    function status(text, color = C.B_WHITE) {
      message = text
      messageColor = color
      flashUntil = performance.now() + 900
    }

    function describeSaveResult(result, slot) {
      if (result.ok) return status(`${slot.toUpperCase()} SAVED`, C.B_GREEN)
      if (result.reason === 'throttled') return status('AUTO THROTTLED', C.B_YELLOW)
      return status(`SAVE FAILED:${result.reason.toUpperCase()}`, C.B_RED)
    }

    function describeLoadResult(result) {
      if (result.ok) return status(`LOADED:${result.slot.toUpperCase()}`, C.B_GREEN)
      return status(`LOAD FAILED:${result.reason.toUpperCase()}`, C.B_RED)
    }

    function autoSave() {
      describeSaveResult(writeSaveThrottled(save, 'auto', AUTO_INTERVAL_MS), 'auto')
    }

    function manualSave() {
      describeSaveResult(writeSave(save, 'manual'), 'manual')
    }

    function loadLatest() {
      describeLoadResult(readSaveLatest(save))
    }

    function loadAuto() {
      describeLoadResult(readSave(save, 'auto'))
    }

    function deleteManual() {
      const removed = deleteSave(save, 'manual')
      status(removed ? 'MANUAL DELETED' : 'NO MANUAL SLOT', removed ? C.B_GREEN : C.B_YELLOW)
    }

    function resetState() {
      state.score = 1200
      state.lives = 3
      state.sector = 1
      state.language = 'EN'
      state.pilot.x = 120
      state.pilot.y = 152
      status('RUNTIME STATE RESET', C.B_CYAN)
    }

    function cycleLanguage() {
      const idx = LANGS.indexOf(state.language)
      state.language = LANGS[(idx + 1) % LANGS.length]
      status(`LANG:${state.language}`, C.B_CYAN)
    }

    function damage() {
      state.lives = Math.max(0, state.lives - 1)
      status('LIFE LOST - SAVE NOT AUTO', C.B_RED)
    }

    function scorePoint() {
      state.score += 50
      if (state.score % 250 === 0) state.sector += 1
      status('SCORE CHANGED', C.B_YELLOW)
    }

    function move(dx, dy) {
      state.pilot.x = Math.max(24, Math.min(224, state.pilot.x + dx))
      state.pilot.y = Math.max(144, Math.min(162, state.pilot.y + dy))
    }

    function drawSlotBlock(slot, y, newestTimestamp) {
      const fresh = slot.timestamp === newestTimestamp
      const name = slot.name.toUpperCase().slice(0, 6)
      const age = Math.max(0, Math.floor((Date.now() - slot.timestamp) / 1000))
      const marker = fresh ? '>' : ' '
      const color = fresh ? C.B_GREEN : C.B_WHITE
      drawText(ctx, `${marker}${name} ${String(slot.sizeBytes)}B`, 140, y, color, C.BLACK)
      drawText(ctx, ` AGE:${String(age)}S V${slot.version}`, 140, y + 10, C.B_WHITE, C.BLACK)
    }

    function restoreLatestOnStart() {
      const hasKnownSlot = listSaves(save).some(slot => slot.name === 'auto' || slot.name === 'manual')
      if (!hasKnownSlot) return
      const result = readSaveLatest(save)
      if (result.ok) status(`RESTORED:${result.slot.toUpperCase()}`, C.B_GREEN)
    }

    function render(now) {
      const slots = listSaves(save).sort((a, b) => b.timestamp - a.timestamp)
      const newestTimestamp = slots[0]?.timestamp ?? -1

      ctx.fillStyle = C.BLACK
      ctx.fillRect(0, 0, 256, 192)

      drawFrame(ctx, { x: 0, y: 0, width: 256, height: 192, color: C.B_BLUE })
      drawTextCentered(ctx, 'SAVE SLOTS', 8, 32, C.B_YELLOW, C.BLACK)
      drawTextCentered(ctx, 'YOU SHAPE STATE. KIT STORES.', 24, 32, C.B_WHITE, C.BLACK)

      drawBox(ctx, {
        x: 16, y: 42, width: 104, height: 92,
        paper: C.BLACK,
        ink: C.B_CYAN,
        border: { thickness: 1 },
      })
      drawText(ctx, 'STATE', 24, 50, C.B_CYAN, C.BLACK)
      drawText(ctx, `POS:${String(Math.round(state.pilot.x)).padStart(3, ' ')},${String(Math.round(state.pilot.y)).padStart(3, ' ')}`, 24, 66, C.B_WHITE, C.BLACK)
      drawText(ctx, `SCORE:${String(state.score).padStart(5, '0')}`, 24, 82, C.B_WHITE, C.BLACK)
      drawText(ctx, `LIFE:${state.lives} ${state.language}`, 24, 98, state.lives > 1 ? C.B_GREEN : C.B_RED, C.BLACK)
      drawText(ctx, `SECTOR:${state.sector}`, 24, 114, C.B_YELLOW, C.BLACK)

      drawBox(ctx, {
        x: 136, y: 42, width: 104, height: 92,
        paper: C.BLACK,
        ink: C.B_MAGENTA,
        border: { thickness: 1 },
      })
      drawText(ctx, 'SLOTS', 140, 50, C.B_MAGENTA, C.BLACK)
      if (slots.length === 0) {
        drawText(ctx, 'NO SLOTS', 140, 74, C.B_YELLOW, C.BLACK)
        drawText(ctx, 'A OR S', 140, 90, C.B_WHITE, C.BLACK)
      } else {
        slots.slice(0, 2).forEach((slot, idx) => drawSlotBlock(slot, 68 + idx * 30, newestTimestamp))
      }

      ctx.strokeStyle = C.BLUE
      ctx.strokeRect(20.5, 140.5, 216, 31)
      ctx.fillStyle = C.BLUE
      ctx.fillRect(21, 156, 214, 1)
      drawBitmap(ctx, SHIP, Math.round(state.pilot.x), Math.round(state.pilot.y), C.B_CYAN)

      const hot = now < flashUntil
      drawTextCentered(ctx, hot ? message : 'A AUTO S MAN L LOAD D DEL', 176, 32, hot ? messageColor : C.B_WHITE, C.BLACK)
    }

    autoButton.addEventListener('click', autoSave)
    manualButton.addEventListener('click', manualSave)
    latestButton.addEventListener('click', loadLatest)
    loadAutoButton.addEventListener('click', loadAuto)
    deleteManualButton.addEventListener('click', deleteManual)
    resetButton.addEventListener('click', resetState)

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase()
      if (event.key === 'ArrowLeft') move(-4, 0)
      if (event.key === 'ArrowRight') move(4, 0)
      if (event.key === 'ArrowUp') move(0, -4)
      if (event.key === 'ArrowDown') move(0, 4)
      if (event.key === ' ') {
        event.preventDefault()
        scorePoint()
      }
      if (key === 'a') autoSave()
      if (key === 's') manualSave()
      if (key === 'l') loadLatest()
      if (key === 'o') loadAuto()
      if (key === 'd') deleteManual()
      if (key === 'r') resetState()
      if (key === 'g') cycleLanguage()
      if (key === 'x') damage()
    })

    function frame(now) {
      render(now)
      requestAnimationFrame(frame)
    }

    restoreLatestOnStart()
    requestAnimationFrame(frame)
  </script>
</body>

</html>
